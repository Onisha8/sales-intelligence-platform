version: 2

models:
  - name: stg_sales_data
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: postal_code
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity_sold
        tests: [not_null]
      - name: segment
        tests:
          - accepted_values:
              values: ["Consumer", "Corporate", "Home Office"]

  - name: stg_zip_code
    columns:
      - name: postal_code
        tests: [not_null]
        tests:
          - unique
          - not_null

  - name: int_sales_line
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: sales_amount
        tests: [not_null]

  - name: mart_sales_daily_region
    columns:
      - name: order_date
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: total_sales
        tests: [not_null]
